<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
    <defs>
        <linearGradient id="spark" gradientUnits="userSpaceOnUse" x1="-28" y1="90" x2="28" y2="35">
        <stop offset="0" stop-color="#cba6f7"/>
        <stop offset="0.55" stop-color="#89b4fa"/>
        <stop offset="1" stop-color="#74c7ec"/>
        </linearGradient>
    </defs>
    <!-- isometric: X = 0.866*(x - y), Y = 0.5*(x + y) - z -->
    <g transform="translate(76 130)" stroke-linecap="round" stroke-linejoin="round">
        <!-- rear leg -->
        <path d="M3.46 -118 L47.63 -27.5" stroke="#b5884f" stroke-width="6"/>
        <!-- front A-frame legs -->
        <path d="M-38.97 -22.5 L0 -120 L38.97 22.5" stroke="#d7a86e" stroke-width="6"/>
        <!-- tray, top face -->
        <path d="M-25.98 -50 L25.98 -20 L18.19 -15.5 L-33.77 -45.5 Z" fill="#e8c08a"/>
        <!-- canvas: top, right edge, front -->
        <path d="M-27.71 -102 L20.78 -74 L23.38 -75.5 L-25.11 -103.5 Z" fill="#bac2de"/>
        <path d="M20.78 -74 L23.38 -75.5 L23.38 -20.5 L20.78 -19 Z" fill="#9399b2"/>
        <path d="M-27.71 -102 L20.78 -74 L20.78 -19 L-27.71 -47 Z" fill="#cdd6f4"/>
        <!-- AI sparkles, drawn in the canvas plane -->
        <g transform="matrix(0.866 0.5 0 -1 -3.46 2)" fill="url(#spark)">
        <path d="M0 45.5 Q0 62.5 17 62.5 Q0 62.5 0 79.5 Q0 62.5 -17 62.5 Q0 62.5 0 45.5 Z"/>
        <path d="M16 75 Q16 80 21 80 Q16 80 16 85 Q16 80 11 80 Q16 80 16 75 Z"/>
        <path d="M-17 43 Q-17 47 -13 47 Q-17 47 -17 51 Q-17 47 -21 47 Q-17 47 -17 43 Z"/>
        </g>
        <!-- tray, front and right faces (sit in front of the canvas) -->
        <path d="M-33.77 -45.5 L18.19 -15.5 L18.19 -12.5 L-33.77 -42.5 Z" fill="#d7a86e"/>
        <path d="M25.98 -20 L18.19 -15.5 L18.19 -12.5 L25.98 -17 Z" fill="#b5884f"/>
    </g>
</svg>
