[workspace]
resolver = "3"
members = ["crates/easel-core", "crates/easel"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "LicenseRef-None"
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.clippy]
dbg_macro = "deny"
disallowed_methods = "deny"
redundant_clone = "deny"
todo = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
split-debuginfo = "unpacked"
debug = "limited"
codegen-units = 16

[profile.dev.build-override]
split-debuginfo = "unpacked"
debug = "limited"
codegen-units = 16

[profile.dev.package]
gpui_macros = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
serde_json = { opt-level = 3 }
syn = { opt-level = 3 }
quote = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
image = { opt-level = 3 }
# JPEG bytes are decoded in these crates, not in `image`.
zune-jpeg = { opt-level = 3 }
zune-core = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 1
