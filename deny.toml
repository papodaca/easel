[advisories]
yanked = "deny"
# Transitive gpui crates (paste, rustybuzz, ttf-parser) are unmaintained with
# no upgrade that stays on Zed v1.24.2. Vulnerabilities still fail the check.
unmaintained = "workspace"

[licenses]
private = { ignore = true }
unused-allowed-license = "allow"
confidence-threshold = 0.8
# Every license not listed here is rejected. GPL-* and AGPL-* are left off
# so a Zed GPL crate cannot enter the graph.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["zed-industries"]
